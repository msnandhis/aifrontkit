name: upstream compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-release-matrix:
    name: verify ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        release:
          - ai-sdk-v6
          - ai-sdk-v7
          - ag-ui-minimum
          - ag-ui-current
          - langgraph-minimum
          - langgraph-current
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned published release
        run: pnpm compatibility:verify --id "${{ matrix.release }}"

  adapter-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Test fixture configuration and adapter projections
        run: |
          pnpm compatibility:test
          pnpm --filter @aifrontkit/adapters test
      - name: Compare pinned fixtures with npm releases
        shell: bash
        run: |
          set -o pipefail
          pnpm compatibility:upstream --fail-on-drift | tee upstream-compatibility.md
      - name: Publish compatibility report
        if: always()
        shell: bash
        run: |
          if [[ -f upstream-compatibility.md ]]; then
            cat upstream-compatibility.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Compatibility monitor did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
